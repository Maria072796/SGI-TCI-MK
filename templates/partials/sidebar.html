<!-- Sidebar parcial para reutilización -->
<nav class="sidebar" id="sidebar">
    <div class="brand">
        <span>SGI-TCI MK</span>
        <div class="brand-subtitle">Miscelánea Karen@</div>
    </div>
    
    <div class="nav flex-column mt-3">
        <a href="{{ url_for('auth.dashboard') }}" class="nav-link {% if request.endpoint == 'auth.dashboard' %}active{% endif %}">
            <i class="bi bi-house"></i>
            <span>Inicio</span>
        </a>
        
        {% if current_user.is_authenticated %}
            <a href="{{ url_for('ventas.listar') }}" class="nav-link {% if request.endpoint and 'ventas' in request.endpoint %}active{% endif %}">
                <i class="bi bi-cart"></i>
                <span>Ventas</span>
            </a>
            
            {% if current_user.rol == 'administrador' %}
                <a href="{{ url_for('inventario.listar') }}" class="nav-link {% if request.endpoint and 'inventario' in request.endpoint %}active{% endif %}">
                    <i class="bi bi-box-seam"></i>
                    <span>Inventario</span>
                </a>
                
                <a href="{{ url_for('egresos.listar') }}" class="nav-link {% if request.endpoint and 'egresos' in request.endpoint %}active{% endif %}">
                    <i class="bi bi-cash-stack"></i>
                    <span>Gastos</span>
                </a>
                
                <a href="{{ url_for('reportes.reportes_menu') }}" class="nav-link {% if request.endpoint and 'reportes' in request.endpoint %}active{% endif %}">
                    <i class="bi bi-graph-up"></i>
                    <span>Reportes</span>
                </a>
                
                <a href="{{ url_for('auth.listar_usuarios') }}" class="nav-link {% if request.endpoint and 'usuarios' in request.endpoint %}active{% endif %}">
                    <i class="bi bi-people"></i>
                    <span>Usuarios</span>
                </a>
            {% else %}
                <a href="{{ url_for('reportes.cierre_caja') }}" class="nav-link {% if request.endpoint and 'cierre_caja' in request.endpoint %}active{% endif %}">
                    <i class="bi bi-cash"></i>
                    <span>Cierre de caja</span>
                </a>
            {% endif %}
        {% endif %}
    </div>
    
    <div class="sidebar-footer">
        <a href="{{ url_for('auth.logout') }}" class="nav-link">
            <i class="bi bi-box-arrow-right"></i>
            <span>Cerrar sesión</span>
        </a>
    </div>
</nav>
